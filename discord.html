<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FAFAF9;
    --text: #111111;
    --muted: #8A8A88;
    --line: #E7E6E3;
    --accent: #5865F2;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    text-align: center;
    max-width: 420px;
    animation: fadeUp 0.7s ease forwards;
  }

  .logo {
    width: 36px;
    height: 36px;
    margin: 0 auto 28px;
    display: block;
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    padding: 0.85rem 1.8rem;
    border-radius: 999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
  }

  .btn svg {
    width: 18px;
    height: 18px;
  }

  .note {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
